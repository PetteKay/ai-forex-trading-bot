name: Release

# Builds ForexBot.exe on Windows and attaches it to the GitHub release.
#   * runs when a release is published
#   * or by hand: Actions -> Release -> Run workflow, with the tag (e.g. v1.0.0)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Build and smoke-test ForexBot.exe
        run: python build_app.py
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ForexBot $TAG" --notes "See README.md"
          gh release upload "$TAG" dist/ForexBot-*-windows-x64.zip dist/ForexBot-*-windows-x64.zip.sha256 --clobber
